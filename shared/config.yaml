# Network Decision Thresholds & Engine Settings (owned by Role 2, read by all)
network:
  good_rtt_max_ms: 150
  good_packet_loss_max_pct: 2.0
  good_bitrate_min_kbps: 500
  speech_service_latency_max_ms: 3000
  stale_stats_seconds: 6.0
  hysteresis_windows: 3
  window_seconds: 2.0
  initial_mode: "subtitle"

audio:
  sample_rate: 16000
  channels: 1
  frame_samples: 512
  frame_bytes: 1024
  min_chunk_ms: 400
  max_chunk_sec: 4.0

timeouts:
  speech_service_s: 6.0
  health_poll_interval_s: 2.0
