name: VAAK Continuous Integration (CI)

on:
  push:
    branches: [main, role1-frontend, role2-callserver, role3-speech, role4-speaker]
  pull_request:
    branches: [main]

jobs:
  frontend-check:
    name: Frontend Lint, Tests & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest Unit Tests
        working-directory: frontend
        run: npm test

      - name: Run Audio Pipeline & Resampler Checks
        run: |
          node frontend/tests/netStats.check.mjs
          node frontend/tests/queue_and_captions.check.mjs
          node frontend/tests/resampler.check.mjs

      - name: Build Production Bundle
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_MOCK: "0"
          VITE_API_BASE_URL: "/api"
